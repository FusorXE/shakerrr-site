name: Publish exact Angie and Elderflower Samba
on:
  push:
    branches: [reconstruct-shakerrr-20260928]
    paths:
      - .shakerrr-publish-reconstruction
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconstruct-shakerrr-20260928
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install project dependencies
        run: npm ci
      - name: Download and convert exact published photographs
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from html import unescape
          from io import BytesIO
          from pathlib import Path
          import re
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          from PIL import Image

          UA = 'Mozilla/5.0 (compatible; ShakerrrRecipeArchive/1.0)'
          def get(url, referer=None):
              headers = {'User-Agent': UA, 'Accept': '*/*'}
              if referer: headers['Referer'] = referer
              return urlopen(Request(url, headers=headers), timeout=45).read()

          def save_webp(body, output):
              image = Image.open(BytesIO(body)).convert('RGB')
              image.thumbnail((1200, 1200), Image.Resampling.LANCZOS)
              out = Path(output)
              out.parent.mkdir(parents=True, exist_ok=True)
              image.save(out, 'WEBP', quality=88, method=6)
              print(f'Wrote {out}: {image.width}x{image.height}, {out.stat().st_size} bytes')

          # Exact Curiada Elderflower Samba Martini image from its named recipe page.
          curiada_page = 'https://curiada.com/blogs/cocktail-library/elderflower-samba-martini'
          curiada_img = 'https://curiada.com/cdn/shop/articles/1e31fe5b-a4c3-4916-951c-9765fef50856_800x.png?v=1770221671'
          save_webp(get(curiada_img, curiada_page), 'assets/recipes/elderflower-samba-martini-curiada.webp')

          # Exact Angie’s Secret article. Prefer a July 2023 article image, otherwise use og:image.
          angie_page = 'https://mrcockandtails.com/2023/07/24/angies-secret/'
          html = get(angie_page).decode('utf-8', 'replace')
          candidates = []
          for raw in re.findall(r'<img[^>]+(?:src|data-src)=["\']([^"\']+)["\']', html, flags=re.I):
              url = urljoin(angie_page, unescape(raw))
              if '/2023/07/' in url and 'avatar' not in url.lower():
                  candidates.append(url)
          og = re.search(r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)', html, flags=re.I)
          if og:
              candidates.append(urljoin(angie_page, unescape(og.group(1))))
          if not candidates:
              raise RuntimeError('Could not locate Angie’s Secret article image')
          last_error = None
          for image_url in dict.fromkeys(candidates):
              try:
                  body = get(image_url, angie_page)
                  image = Image.open(BytesIO(body))
                  if image.width < 300 or image.height < 300:
                      continue
                  save_webp(body, 'assets/recipes/angies-secret-exact.webp')
                  print('Angie source image:', image_url)
                  break
              except Exception as exc:
                  last_error = exc
          else:
              raise RuntimeError(f'Could not download a usable Angie’s Secret image: {last_error}')
          PY
      - name: Persist exact sources and new recipe
        run: node scripts/publish-reconstruction.mjs
      - name: Refresh catalog metadata
        run: node scripts/catalog-stats.mjs
      - name: Validate catalog
        run: npm run validate
      - name: Check diff
        run: git diff --check
      - name: Commit durable reconstruction changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/recipes/angies-secret-exact.webp assets/recipes/elderflower-samba-martini-curiada.webp data/recipes.json data/image-manifest.json data/catalog-meta.json data/collections.json
          git rm -f .github/workflows/finalize-final10-images.yml .shakerrr-final10-images.zip .shakerrr-finalize-final10 scripts/finalize-final10-images.mjs || true
          git rm -f .github/workflows/publish-reconstruction.yml .shakerrr-publish-reconstruction scripts/publish-reconstruction.mjs
          git commit -m "Add exact Angie image and Elderflower Samba Martini"
          git push origin HEAD:reconstruct-shakerrr-20260928
