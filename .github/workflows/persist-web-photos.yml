name: Persist curated website photographs
on:
  push:
    branches: [main]
    paths:
      - "data/web-photos.json"
      - "scripts/persist-web-photos.py"
      - ".github/workflows/persist-web-photos.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: curated-website-photos
  cancel-in-progress: false
jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image optimizer
        run: python -m pip install --quiet Pillow
      - name: Persist up to ten validated image candidates
        run: python scripts/persist-web-photos.py
      - name: Commit and push optimized actual image binaries
        run: |
          git add data/web-photos.json assets/recipes/web/
          if git diff --cached --quiet; then
            echo "No new binary files to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Persist first curated web photo batch as WebP"
          git push origin HEAD:main
