name: Bootstrap Shakerrr Pages

on:
  push:
    paths:
      - '.github/workflows/bootstrap-pages.yml'

permissions:
  contents: write

jobs:
  publish-static-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v4

      - name: Download verified private build artifact
        run: |
          curl --fail --location 'https://sdmntpreastus.oaiusercontent.com/files/00000000-1384-81f9-92a4-f7bec3b873f6/raw?se=2026-08-17T20%3A26%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=b35134a3-98e6-5b11-ae92-c12bd48586c7&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-16T21%3A40%3A36Z&ske=2026-08-17T21%3A40%3A36Z&sks=b&skv=2026-02-06&sig=9nUxizWGy7vVwct%2Btz%2B0oKGzuuGlezv8LP/fYLHaFkQ%3D' --output shakerrr-pages-dist.zip
          mkdir stage
          unzip -q shakerrr-pages-dist.zip -d stage

      - name: Verify static build
        run: |
          test -f stage/index.html
          test -f stage/app.js
          test -f stage/styles.css
          test -f stage/data/recipes.json
          test -f stage/data/world.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('stage/data/recipes.json','utf8')); const w=JSON.parse(fs.readFileSync('stage/data/world.json','utf8')); const names=new Set(r.map(x=>x.name)); if(r.length!==606||new Set(r.map(x=>x.id)).size!==606||w.length!==177||!names.has('Padang Swizzle')||!names.has('Rhythm and Soul')||!names.has('Bitter Tom')) process.exit(1); console.log('Verified production build:',r.length,'recipes,',w.length,'world entries');"

      - name: Install production files at repository root
        run: |
          cp stage/index.html index.html
          cp stage/app.js app.js
          cp stage/styles.css styles.css
          mkdir -p data
          cp stage/data/recipes.json data/recipes.json
          cp stage/data/world.json data/world.json
          cp stage/data/collections.json data/collections.json
          touch .nojekyll

      - name: Commit production site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js styles.css data .nojekyll
          git commit -m 'Publish verified Shakerrr static site'
          git push
