name: Finalize final ten images
on:
  push:
    branches: [reconstruct-shakerrr-20260928]
    paths:
      - .shakerrr-finalize-final10
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[finalize-final10]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconstruct-shakerrr-20260928
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Expand verified final-ten images
        run: |
          mkdir -p assets/recipes
          unzip -o .shakerrr-final10-images.zip -d assets/recipes
      - name: Persist canonical image assignments
        run: node scripts/finalize-final10-images.mjs
      - name: Validate catalog and image provenance
        run: npm run validate
      - name: Check generated diff
        run: git diff --check
      - name: Commit persisted final-ten image batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/recipes data/recipes.json data/image-manifest.json data/catalog-meta.json
          git rm .shakerrr-final10-images.zip .shakerrr-finalize-final10 scripts/finalize-final10-images.mjs
          git commit -m "Persist final 10 representative cocktail images [finalize-final10]"
          git push origin HEAD:reconstruct-shakerrr-20260928
